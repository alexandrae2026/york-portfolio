  }
  function strike(i, bend, vol) {                  // the note the light asks for, and most of a second later the model's answer, softer
    const a = audio.ac.currentTime; pluck(NOTES[i] * (1 + 0.012 * bend), vol, a);
    const jp = Math.round(lumPS * (NOTES.length - 1)), j = jp >= 7 ? jp - 7 : jp + 7;   // the model answers, an octave below the note it expected: in tune when it was right, a step out when the sky surprised it
    pluck(NOTES[j], vol * 0.5, a + 0.8);
  }
  function soundUpdate(t, dt, act) {
    if (!audio) return; const a = audio.ac.currentTime; const lum = lumS;
    // the bass hears the skin under the light it was tuned to, a shade warmer than the picture's, so the chord's weighting stays as it was
    const Lw = ambient(0.0 + 0.22 * lum), Lc = ambient(0.1 + 0.5 * lum), spec = SPEC.map((v, b) => v * Lc[b] / Lw[b]); const tot = spec.reduce((x, y) => x + y, 0) + 1e-6;
    // the light: a note is struck only when the light has moved a step (a little more than doubled or halved) since the last one,
    // its pitch the light's level, dark low and bright high; a steady night or a flat noon is silent, a dawn or a storm front plays
    const x = lum * (NOTES.length - 1); audio.lastStrike += dt;
    if ((audio.lastIdx < 0 || Math.abs(x - audio.lastIdx) > 0.75) && audio.lastStrike > 0.45) {
      const i = Math.round(x); strike(i, x - i, 0.05 + 0.05 * lum); audio.lastIdx = i; audio.lastStrike = 0;
    }
    // the night, as far as the record is dark: nothing in a midsummer night at this latitude, everything in September
    const dark = Math.max(0, Math.min(1, (0.4 - lum) / 0.3)), breath = 0.65 + 0.35 * Math.sin(t * 0.00075), swell = 0.75 + 0.25 * Math.sin(t * 0.00052 + 2);
    audio.night[0].g.gain.setTargetAtTime(0.028 * dark * dark * breath, a, 0.8); audio.night[1].g.gain.setTargetAtTime(0.016 * dark * dark * swell, a, 0.8);
    audio.night[1].o.frequency.setTargetAtTime(92.50 * (1 + 0.003 * Math.sin(t * 0.0003)), a, 1);
    // the dream: a low chord in the colours the sacs are showing, an octave below the voice, fading in as the skin changes,
    // and rocking in a slow six-eight between the minor chord and the chord a third below it, two seconds each way
    const shimmer = Math.min(1, iridShare * 3 / (0.05 + lum)), bass = act * act * 0.8, sway = 0.5 + 0.5 * Math.sin(t * Math.PI / 2000);
    audio.parts.forEach((p, b) => {
      const chord = 0.25 + 0.75 * (IN_I[b] * sway + IN_VI[b] * (1 - sway));
      const amp = Math.min(0.1, 0.26 * spec[b] / tot) * bass * chord;
      p.g.gain.setTargetAtTime(amp * (1 - 0.5 * shimmer), a, 0.4); p.g2.gain.setTargetAtTime(amp * shimmer, a, 0.4);
      p.o2.frequency.setTargetAtTime(FREQ[b] * (1.002 + 0.004 * Math.sin(t * 0.0004 + b)), a, 0.6);
    });
    // the white layer, faintly, as much as the light lets it show
    audio.ng.gain.setTargetAtTime(Math.min(0.03, whiteShare * 0.06 / (0.05 + lum)) * (0.1 + 0.9 * lum) + 0.035 * dark * (0.6 + 0.4 * Math.sin(t * 0.0006 + 1)), a, 0.6);
    audio.bp.frequency.setTargetAtTime(400 + 1200 * lum - 220 * dark, a, 0.8);
  }
  soundBtn.addEventListener("click", () => {
    if (audio) { const a = audio; audio = null; a.master.gain.setTargetAtTime(0, a.ac.currentTime, 0.2); setTimeout(() => a.ac.close(), 600); soundBtn.textContent = "Sound on"; soundBtn.setAttribute("aria-pressed", "false"); }
    else { try { soundStart(); soundBtn.textContent = "Sound off"; soundBtn.setAttribute("aria-pressed", "true"); } catch (e) { soundBtn.textContent = "No sound here"; } }
  });

  // ---------- time ----------
  let running = false, last = 0, clock = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000 || 0); last = now;
    if (!autoSpin && !drag && now - idleSince > 4000) autoSpin = true;
    spinRate += ((autoSpin ? 0.05 : 0) - spinRate) * Math.min(1, dt * 0.5);                 // and eases back in rather than jumping
    if (running) { clock += dt; yaw += dt * spinRate; step(clock * 1000, dt); }
    draw(); soundUpdate(clock * 1000, running ? dt : 0, running ? activeLevel : 0); requestAnimationFrame(frame);
  }
  const runBtn = document.getElementById("run");
  runBtn.addEventListener("click", () => { running = !running; runBtn.textContent = running ? "Pause" : "Begin"; runBtn.setAttribute("aria-pressed", String(running)); });
  const workEl = document.getElementById("work"); let tap = null;
  document.getElementById("darken").addEventListener("click", () => { if (document.activeElement) document.activeElement.blur(); workEl.classList.add("dark"); });
  cv.addEventListener("pointerdown", e => { tap = { x: e.clientX, y: e.clientY }; });
  cv.addEventListener("pointerup", e => { if (tap && workEl.classList.contains("dark") && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < 8) workEl.classList.remove("dark"); tap = null; });
  addEventListener("keydown", e => { if ((e.key === "Escape" || e.key === "Tab") && workEl.classList.contains("dark")) workEl.classList.remove("dark"); });

  resize(); step(0, 0.016); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
